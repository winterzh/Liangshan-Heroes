<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>江州车独立轮辐 · 动画试验</title>
<style>body{margin:0;background:#23221f;color:#eee9dc;font:15px system-ui,sans-serif}main{max-width:1440px;margin:auto;padding:20px}h1{font-size:23px;margin:0 0 8px}.note{color:#d8c6a5;margin-bottom:18px}.controls{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:14px;background:#34322d;border-radius:9px}select,button{font:inherit;color:#eee9dc;background:#48443a;border:1px solid #746b56;border-radius:5px;padding:6px 12px}label{display:flex;gap:9px;align-items:center}input[type=range]{width:190px}canvas{display:block;width:100%;height:auto;background:#292824;border-radius:8px;margin-top:16px}pre{font-size:12px;color:#bfb9aa;white-space:pre-wrap}output{font-variant-numeric:tabular-nums;min-width:65px}.status{margin-top:10px;color:#dfb370}</style>
<main><h1>江州车：独立轮辐转动试验</h1><div class="note">浏览器渲染试验。模拟位移输入，尚未接入游戏；原始PNG未改。轮缘/轮毂与车身保持固定，轮辐在轮面内转动。</div>
<div class="controls"><label>方向<select id="direction"><option value="se">东南 SE</option><option value="sw">西南 SW</option><option value="ne">东北 NE</option><option value="nw">西北 NW</option></select></label><label>试验位移<input id="travel" type="range" min="0" max="1000" step="0.25" value="0"><output id="travel_value">0.00 px</output></label><button id="play">播放位移</button><button id="reset">回到起点</button><label><input id="guides" type="checkbox">显示轮面中心</label><button id="download">导出当前对照</button></div>
<canvas id="stage" width="1440" height="820" aria-label="左侧旧生产车，右侧车身加固定轮圈轮毂及独立转动轮辐"></canvas><div id="status" class="status">正在载入原图…</div><pre id="measurements"></pre></main>
<script>
const fit=__FIT__,urls=__URLS__,hashes=__HASHES__;const $=id=>document.getElementById(id),ctx=$('stage').getContext('2d'),images={};let ready=false,travel=0,playing=false,lastTime=0;
const mul=(a,b)=>[[a[0][0]*b[0][0]+a[0][1]*b[1][0],a[0][0]*b[0][1]+a[0][1]*b[1][1]],[a[1][0]*b[0][0]+a[1][1]*b[1][0],a[1][0]*b[0][1]+a[1][1]*b[1][1]]];const vec=(a,v)=>[a[0][0]*v[0]+a[0][1]*v[1],a[1][0]*v[0]+a[1][1]*v[1]];const inv=a=>{const q=a[0][0]*a[1][1]-a[0][1]*a[1][0];return [[a[1][1]/q,-a[0][1]/q],[-a[1][0]/q,a[0][0]/q]]};
function draw(){if(!ready)return;const d=$('direction').value,row=fit.directions[d],pose=row.original_cart_pose,unit=400/pose.virtual_canvas_reference,reg=pose.region,center=[reg[0]+reg[2]/2,reg[1]+reg[3]/2],theta=row.phase_sign*travel/row.test_radius_original_native;ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#292824';ctx.fillRect(0,0,1440,820);ctx.fillStyle='#eee9dc';ctx.font='bold 24px system-ui';ctx.fillText(d.toUpperCase()+' · 旧生产车',40,55);ctx.fillText(d.toUpperCase()+' · 分层轮辐试验',760,55);ctx.strokeStyle='#514b3f';ctx.beginPath();ctx.moveTo(720,85);ctx.lineTo(720,745);ctx.stroke();
function point(panel,p){return [360+panel*720+(p[0]-center[0])*unit,430+(p[1]-center[1])*unit]}function paint(panel,img,region,sc=1,tr=[0,0]){const p=point(panel,[region[0]*sc+tr[0],region[1]*sc+tr[1]]);ctx.drawImage(img,...region,...p,region[2]*sc*unit,region[3]*sc*unit)}
paint(0,images.original,reg);paint(1,images.body,reg);
const sr=row.rim_uniform_scale,tr=row.rim_translation_original_native,rc=row.rim_plane_center,sc=row.spoke_plane_center,ar=row.rim_inner_plane_axes,asp=row.spoke_normalization_axes,c=Math.cos(theta),s=Math.sin(theta),rot=[[c,-s],[s,c]],b=mul(mul(ar,rot),inv(asp)).map(r=>r.map(v=>v*row.spoke_end_overlap)),bc=vec(b,sc),destination=point(1,[tr[0]+sr*rc[0],tr[1]+sr*rc[1]]);
ctx.save();ctx.translate(...destination);ctx.transform(ar[0][0]*sr*unit,ar[1][0]*sr*unit,ar[0][1]*sr*unit,ar[1][1]*sr*unit,0,0);ctx.beginPath();ctx.arc(0,0,row.clip_inner_radius,0,2*Math.PI);ctx.clip();const t=point(1,[tr[0]+sr*(rc[0]-bc[0]),tr[1]+sr*(rc[1]-bc[1])]);ctx.setTransform(b[0][0]*sr*unit,b[1][0]*sr*unit,b[0][1]*sr*unit,b[1][1]*sr*unit,t[0],t[1]);ctx.drawImage(images.spokes,...row.region,...row.region);ctx.restore();paint(1,images.rim,row.region,sr,tr);
if($('guides').checked){ctx.strokeStyle='#8ed1e8';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(destination[0],destination[1],7,0,Math.PI*2);ctx.stroke()}
ctx.fillStyle='#c8c0ae';ctx.font='17px system-ui';ctx.fillText('Canvas prototype / original PNGs untouched / no Godot, Unit, world-motion or final rolling acceptance.',28,785);$('travel').value=travel;$('travel_value').value=travel.toFixed(2)+' px';$('measurements').textContent=JSON.stringify({direction:d,playing,travel_original_native:travel,phase_radians:theta,rim_center_screen:destination,rim_scale:sr,rim_translation:tr,source_sha256:hashes,scope:'浏览器模拟位移渲染；完整轮圈/固定轮毂不随相位转动。尚无真实游戏位移、停车、原生或最终动画资格。'},null,2)}
function frame(now){if(!playing)return;const dt=lastTime?Math.min((now-lastTime)/1000,0.1):0;lastTime=now;travel=(travel+dt*60)%1000;draw();requestAnimationFrame(frame)}
function stop(){playing=false;lastTime=0;$('play').textContent='播放位移';draw()}
$('play').addEventListener('click',()=>{if(playing)stop();else{playing=true;lastTime=0;$('play').textContent='暂停位移';requestAnimationFrame(frame)}});$('travel').addEventListener('input',()=>{const next=Number($('travel').value);stop();travel=next;draw()});$('direction').addEventListener('change',()=>{stop();draw()});$('reset').addEventListener('click',()=>{stop();travel=0;draw()});$('guides').addEventListener('change',draw);
$('download').addEventListener('click',()=>{stop();$('stage').toBlob(blob=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='browser_canvas_'+$('direction').value+'_'+travel.toFixed(2)+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},'image/png')});
Promise.all(Object.entries(urls).map(([key,url])=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{images[key]=im;resolve()};im.onerror=reject;im.src=url}))).then(()=>{ready=true;$('status').textContent='已载入四份原字节图。可以暂停观察轮辐接缝；这不是游戏中的真实行驶测试。';draw()}).catch(e=>{$('status').textContent='载入失败：'+e});
</script></html>
