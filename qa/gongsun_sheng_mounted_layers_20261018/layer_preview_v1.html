<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>公孙胜骑乘分层检查</title>
<style>
body{margin:20px;background:#24231f;color:#eee9dc;font:16px system-ui}h1{font-size:20px}button,select,input{font:inherit}button,select{margin-right:12px;padding:7px}label{display:inline-flex;gap:8px;align-items:center;margin-right:16px}.grid{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:8px}.cell{background:#302e27}.cell h2{font-size:16px;padding:8px;margin:0}.cell canvas{display:block;width:100%;height:auto}.controls{margin:12px 0}pre{white-space:pre-wrap;font-size:12px}#status{min-height:24px;color:#e9d8a1}body.single .grid{grid-template-columns:minmax(400px,560px)}
</style>
<h1>公孙胜 · 固定马身与骑手层</h1>
<div class="controls"><label>方向 <select id="direction"><option value="all">四向</option><option value="se">东南</option><option value="sw">西南</option><option value="ne">东北</option><option value="nw">西北</option></select></label><label>画面 <select id="mode"><option value="recoil">分层受击</option><option value="recover">分层恢复</option><option value="original">原合图受击参考</option><option value="old_recovery">旧恢复参考</option><option value="horse">仅固定马身</option></select></label><button id="play" type="button" aria-pressed="false">播放受击 / 恢复</button><label><input id="anchors" type="checkbox" checked>定位点</label></div>
<div id="status">载入原始 PNG…</div>
<div class="grid" id="grid"></div>
<div class="controls"><label>当前方向骑手统一比例 <input id="scale" type="number" min="0.5" max="1.2" step="0.01"></label><label>横向偏移 <input id="offset_x" type="number" step="1"></label><label>纵向偏移 <input id="offset_y" type="number" step="1"></label></div>
<p>浏览器合成检查；不是 Godot、实际单位或整套动画验收。比例对同方向两帧固定，偏移仅用于定位。原 PNG 未修改。</p><pre id="settings"></pre>
<script>
'use strict';
const dirs=['se','sw','ne','nw'],labels={se:'东南',sw:'西南',ne:'东北',nw:'西北'};
const sourceFiles={horse:'images/horse.png',recoil:'images/rider_recoil.png',recover:'images/rider_recover.png',original:'images/original_recoil.png',old_recovery:'images/original_recover.png'};
const calibration={se:{horse:{scale:.97,offset:[9.61,3.43],rein:[348,266]},rider:{scale:.8,offset:[0,0],recoil:[365,291],recover:[370,302]}},sw:{horse:{scale:.97,offset:[35.23,3.43],rein:[936,267]},rider:{scale:.8,offset:[0,0],recoil:[960,302],recover:[960,312]}},ne:{horse:{scale:.91,offset:[42.03,112.96],rein:[370,829]},rider:{scale:.8,offset:[0,0],recoil:[354,908],recover:[356,915]}},nw:{horse:{scale:.91,offset:[103.31,112.96],rein:[935,833]},rider:{scale:.8,offset:[0,0],recoil:[917,909],recover:[917,919]}}};
const images={},canvases={},root=document.getElementById('grid');let timer=null;
for(const d of dirs){const cell=document.createElement('div');cell.className='cell';cell.dataset.direction=d;const title=document.createElement('h2');title.textContent=labels[d];const canvas=document.createElement('canvas');canvas.width=420;canvas.height=440;canvas.setAttribute('aria-label',labels[d]+'骑乘分层预览');cell.append(title,canvas);root.append(cell);canvases[d]=canvas;}
function point(d,p,s,offset){return[p[0]*s+offset[0],p[1]*s+offset[1]];}
function riderTransform(d,phase){const c=calibration[d],target=point(d,c.horse.rein,c.horse.scale,c.horse.offset);return{scale:c.rider.scale,offset:[target[0]-c.rider[phase][0]*c.rider.scale+c.rider.offset[0],target[1]-c.rider[phase][1]*c.rider.scale+c.rider.offset[1]]};}
function drawImage(ctx,img,d,s,offset){const i=dirs.indexOf(d),sx=(i%2)*627,sy=Math.floor(i/2)*627;ctx.drawImage(img,sx,sy,627,627,(s-1)*sx+offset[0],(s-1)*sy+offset[1],627*s,627*s);}
function cross(ctx,x,y,color){ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x-8,y);ctx.lineTo(x+8,y);ctx.moveTo(x,y-8);ctx.lineTo(x,y+8);ctx.stroke();}
function currentDirection(){const d=document.getElementById('direction').value;return d==='all'?'se':d;}
function syncInputs(){const r=calibration[currentDirection()].rider;document.getElementById('scale').value=r.scale;document.getElementById('offset_x').value=r.offset[0];document.getElementById('offset_y').value=r.offset[1];}
function render(){const mode=document.getElementById('mode').value,chosen=document.getElementById('direction').value;document.body.classList.toggle('single',chosen!=='all');
for(const d of dirs){const canvas=canvases[d],ctx=canvas.getContext('2d');canvas.parentElement.hidden=chosen!=='all'&&chosen!==d;ctx.clearRect(0,0,420,440);ctx.save();ctx.translate(16,25);ctx.scale(.61,.61);
if(mode==='original'||mode==='old_recovery')drawImage(ctx,images[mode],d,1,[0,0]);else{const c=calibration[d];drawImage(ctx,images.horse,d,c.horse.scale,c.horse.offset);if(mode!=='horse'){const pose=riderTransform(d,mode);drawImage(ctx,images[mode],d,pose.scale,pose.offset);}if(document.getElementById('anchors').checked){const i=dirs.indexOf(d),origin=[(i%2)*627,Math.floor(i/2)*627],p=point(d,c.horse.rein,c.horse.scale,c.horse.offset);cross(ctx,p[0]-origin[0],p[1]-origin[1],'#78db9e');}}
ctx.restore();}document.getElementById('settings').textContent=JSON.stringify(calibration,null,2);document.getElementById('status').textContent='5 张原始 PNG 已载入 · '+document.getElementById('mode').selectedOptions[0].textContent;}
for(const id of ['direction','mode','anchors'])document.getElementById(id).addEventListener('change',()=>{syncInputs();render();});
for(const id of ['scale','offset_x','offset_y'])document.getElementById(id).addEventListener('input',()=>{const r=calibration[currentDirection()].rider;r.scale=Number(document.getElementById('scale').value);r.offset=[Number(document.getElementById('offset_x').value),Number(document.getElementById('offset_y').value)];render();});
document.getElementById('play').addEventListener('click',()=>{if(timer){clearInterval(timer);timer=null;}else{timer=setInterval(()=>{const s=document.getElementById('mode');s.value=s.value==='recover'?'recoil':'recover';render();},500);}document.getElementById('play').setAttribute('aria-pressed',String(Boolean(timer)));});
Promise.all(Object.entries(sourceFiles).map(([key,src])=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{images[key]=im;resolve();};im.onerror=()=>reject(new Error(src));im.src=src;}))).then(()=>{const query=new URLSearchParams(location.search);if(sourceFiles[query.get('mode')])document.getElementById('mode').value=query.get('mode');if(dirs.includes(query.get('direction')))document.getElementById('direction').value=query.get('direction');syncInputs();render();}).catch(e=>{document.getElementById('status').textContent='载入失败：'+e.message;});
</script></html>
